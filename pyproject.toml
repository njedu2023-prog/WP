[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-tail-t1-profit"
version = "8.0.0"
description = "WP A股尾盘买入后T+1净盈利概率决策系统"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.0,<3.0",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "requests>=2.31",
  "tushare>=1.4",
  "scikit-learn>=1.4,<2.0",
  "lightgbm>=4.5,<5.0",
  "joblib>=1.3",
  "pyarrow>=22.0,<26.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
