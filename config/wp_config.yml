project_name: WP T+1 净盈利概率系统
input_url: https://raw.githubusercontent.com/njedu2023-prog/a-share-top3-data/main/data/wp/latest/wp_latest_rank_input.csv
min_pct_chg: 8.0
min_amount: 100000000
top_n: 50
timezone: Asia/Shanghai
exclude_st: true
exclude_suspended: true
exclude_new_stock_days: 10
max_limit_up_pct: 10
buy_max_count: 1
buy_max_sector_positions: 1
tail_profit_min_pct_chg: 8
tail_profit_max_pct_chg: 12
tail_profit_max_risk_score: 45
tail_profit_min_close_position: 50
tail_profit_max_amount_ratio_5d: 2.5

# 唯一生产目标：P(T日尾盘可成交买入后，T+1收盘卖出净收益 > 0)。
# 日线回测代理不得授权正式交易；必须积累真实尾盘因果样本。
forecast_min_total_samples: 30
forecast_min_live_samples: 30
forecast_min_live_days: 30
forecast_min_effective_samples: 15
forecast_proxy_weight: 0.0
forecast_round_trip_cost_pct: 0.25
forecast_downside_penalty: 0.25

# 正式决策：14:20-14:44只观察，14:45起允许BUY，14:55强制冻结。
regime_allow_score: 55
regime_avoid_score: 40
regime_min_universe_count: 200
guidance_wait_until: "14:45"
guidance_final_time: "14:55"
guidance_min_stable_runs: 2
guidance_min_leader_runs: 2
guidance_min_live_samples: 30
guidance_min_live_days: 30
guidance_min_effective_samples: 15
guidance_min_profit_probability: 58
guidance_min_profit_probability_lower: 50
guidance_min_expected_net_return_pct: 0.30
guidance_max_downside_q10_pct: -4.50
guidance_max_data_age_seconds: 120

# 固定执行与验证合同。实际人工成交价可在后续接入成交回执替换参考价。
strategy_entry_contract: signal_last_price
strategy_entry_deadline: "14:55"
strategy_exit_contract: T+1_close
