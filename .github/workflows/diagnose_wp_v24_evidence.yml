name: Diagnose WP V24 Evidence

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful frozen V24 research run
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v24_diagnosis.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v24-evidence-diagnosis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Resolve immutable V24 run
        id: source
        shell: bash
        env:
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          source_run_id="${DISPATCH_SOURCE_RUN_ID:-}"
          if [[ -z "$source_run_id" ]]; then
            source_run_id="$(
              sed -n 's/^source_run_id=//p' \
                scripts/trigger_wp_v24_diagnosis.txt |
                tail -n 1
            )"
          fi
          if [[ ! "$source_run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid source_run_id: $source_run_id" >&2
            exit 1
          fi
          echo "run_id=$source_run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Download immutable V24 evidence
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v24-cross-section-*
          path: artifacts/wp_v24_source
          merge-multiple: false
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify diagnosis contract
        run: >-
          python -m pytest
          tests/test_v24_diagnosis.py
          tests/test_v24_cross_section.py
          -q
        env:
          PYTHONPATH: src:scripts
      - name: Attribute V24 failure
        run: >-
          python -u scripts/diagnose_wp_v24_evidence.py
          --source-dir artifacts/wp_v24_source
          --output-dir artifacts/wp_v24_diagnosis
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
      - name: Upload V24 failure attribution
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v24-failure-attribution-${{ github.run_id }}
          path: artifacts/wp_v24_diagnosis
          retention-days: 90
          if-no-files-found: warn
