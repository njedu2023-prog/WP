name: Analyze WP V9 User Overlay

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Immutable WP V9 research run ID"
        required: true
        default: "30466227350"
        type: string
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v9_user_overlay.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v9-user-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Resolve immutable source run
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          source_run_id="$REQUESTED_SOURCE_RUN_ID"
          if [[ -z "$source_run_id" && "$EVENT_NAME" == "push" ]]; then
            source_run_id="$(
              sed -n 's/^source_run_id=//p' \
                scripts/trigger_wp_v9_user_overlay.txt \
                | tail -n 1 \
                | tr -cd '0-9'
            )"
          fi
          test -n "$source_run_id"
          echo "source_run_id=$source_run_id" >> "$GITHUB_OUTPUT"
      - name: Restore exact causal panel
        uses: actions/cache/restore@v4
        with:
          path: artifacts/wp_v3_history
          key: wp-v9-panel-auto-auto-auto-auto-r15-${{ steps.route.outputs.source_run_id }}
          fail-on-cache-miss: true
      - name: Restore exact daily and price-limit truth
        uses: actions/cache/restore@v4
        with:
          path: .cache/wp_v3_tushare
          key: wp-v9-raw-${{ steps.route.outputs.source_run_id }}
          restore-keys: |
            wp-v9-raw-
          fail-on-cache-miss: true
      - name: Download immutable OOS prediction shards
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.route.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: wp-v9-fold-*
          path: artifacts/wp_v3_shards
          merge-multiple: false
      - name: Run unchanged-model overlay analysis
        run: >-
          python -u scripts/analyze_wp_v9_user_overlay.py
          --config artifacts/wp_v3_history/wp_v9_resolved_config.yml
          --panel-dir artifacts/wp_v3_history/panel
          --raw-cache-dir .cache/wp_v3_tushare
          --shard-dir artifacts/wp_v3_shards
          --output-dir artifacts/wp_v9_user_overlay
          --signal-slot "14:20"
          --intraday-return-min-pct "7.0"
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
      - name: Upload overlay evidence
        uses: actions/upload-artifact@v5
        with:
          name: wp-v9-user-overlay-${{ github.run_id }}
          path: artifacts/wp_v9_user_overlay
          retention-days: 90
