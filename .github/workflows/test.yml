name: Test WP Strategy

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - scripts/**
      - config/**
      - requirements.txt
      - pyproject.toml
      - .github/workflows/test.yml

permissions:
  contents: read

concurrency:
  group: wp-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run strategy tests
        run: python -m pytest -q
