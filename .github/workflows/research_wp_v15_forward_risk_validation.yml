name: Research WP V15 Forward Risk Validation

on:
  workflow_dispatch:
    inputs:
      source_v9_run_id:
        description: "V9 run that owns the immutable causal panel cache"
        required: true
        default: "30466227350"
        type: string
      source_v10_run_id:
        description: "Immutable V10 meta-score run ID"
        required: true
        default: "30516136872"
        type: string
      source_v11_run_id:
        description: "Immutable V11 candidate-frontier run ID"
        required: true
        default: "30545808015"
        type: string
      source_v14_run_id:
        description: "Immutable V14 discovery-evidence run ID"
        required: true
        default: "30551040352"
        type: string
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v15_forward_risk_validation.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v15-forward-risk-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Resolve immutable source runs
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_V9_RUN_ID: ${{ inputs.source_v9_run_id }}
          REQUESTED_V10_RUN_ID: ${{ inputs.source_v10_run_id }}
          REQUESTED_V11_RUN_ID: ${{ inputs.source_v11_run_id }}
          REQUESTED_V14_RUN_ID: ${{ inputs.source_v14_run_id }}
        run: |
          set -euo pipefail
          v9_run_id="$REQUESTED_V9_RUN_ID"
          v10_run_id="$REQUESTED_V10_RUN_ID"
          v11_run_id="$REQUESTED_V11_RUN_ID"
          v14_run_id="$REQUESTED_V14_RUN_ID"
          if [[ "$EVENT_NAME" == "push" ]]; then
            v9_run_id="$(
              sed -n 's/^source_v9_run_id=//p' \
                scripts/trigger_wp_v15_forward_risk_validation.txt \
                | tail -n 1 \
                | tr -cd '0-9'
            )"
            v10_run_id="$(
              sed -n 's/^source_v10_run_id=//p' \
                scripts/trigger_wp_v15_forward_risk_validation.txt \
                | tail -n 1 \
                | tr -cd '0-9'
            )"
            v11_run_id="$(
              sed -n 's/^source_v11_run_id=//p' \
                scripts/trigger_wp_v15_forward_risk_validation.txt \
                | tail -n 1 \
                | tr -cd '0-9'
            )"
            v14_run_id="$(
              sed -n 's/^source_v14_run_id=//p' \
                scripts/trigger_wp_v15_forward_risk_validation.txt \
                | tail -n 1 \
                | tr -cd '0-9'
            )"
          fi
          test -n "$v9_run_id"
          test -n "$v10_run_id"
          test -n "$v11_run_id"
          test -n "$v14_run_id"
          echo "v9_run_id=$v9_run_id" >> "$GITHUB_OUTPUT"
          echo "v10_run_id=$v10_run_id" >> "$GITHUB_OUTPUT"
          echo "v11_run_id=$v11_run_id" >> "$GITHUB_OUTPUT"
          echo "v14_run_id=$v14_run_id" >> "$GITHUB_OUTPUT"
      - name: Restore exact V9 causal panel
        uses: actions/cache/restore@v4
        with:
          path: artifacts/wp_v3_history
          key: wp-v9-panel-auto-auto-auto-auto-r15-${{ steps.route.outputs.v9_run_id }}
          fail-on-cache-miss: true
      - name: Download immutable V10 meta scores
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.route.outputs.v10_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: wp-v10-meta-*
          path: artifacts/wp_v10_source
          merge-multiple: true
      - name: Download immutable V11 candidate frontier
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.route.outputs.v11_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: wp-v11-exit-*
          path: artifacts/wp_v11_source
          merge-multiple: true
      - name: Download immutable V14 discovery evidence
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.route.outputs.v14_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: wp-v14-exit-failure-risk-*
          path: artifacts/wp_v14_source
          merge-multiple: true
      - name: Verify V15 frozen forward contract
        run: >-
          python -m pytest
          tests/test_v11_exit_research.py
          tests/test_v14_exit_risk.py
          tests/test_v15_forward_risk_validation.py
          -q
        env:
          PYTHONPATH: src
          LOKY_MAX_CPU_COUNT: "4"
      - name: Run strict forward risk validation
        run: >-
          python -u scripts/research_wp_v15_forward_risk_validation.py
          --config artifacts/wp_v3_history/wp_v9_resolved_config.yml
          --panel-dir artifacts/wp_v3_history/panel
          --v11-source-dir artifacts/wp_v11_source
          --v10-source-dir artifacts/wp_v10_source
          --v14-source-dir artifacts/wp_v14_source
          --output-dir artifacts/wp_v15_forward_risk_validation
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
          LOKY_MAX_CPU_COUNT: "4"
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
      - name: Upload immutable V15 forward evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v15-forward-risk-validation-${{ github.run_id }}
          path: artifacts/wp_v15_forward_risk_validation
          retention-days: 90
          if-no-files-found: warn
