name: Research WP V39 T-1 Derivatives License

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed V19 run containing immutable V9 OOS shards
        required: true
        type: string
      v39_data_run_id:
        description: Completed immutable V39 T-1 derivatives data run
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v39_research.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v39-tminus1-derivatives-license-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Resolve immutable source runs
        id: source
        shell: bash
        env:
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DISPATCH_V39_DATA_RUN_ID: ${{ inputs.v39_data_run_id }}
        run: |
          set -euo pipefail
          source_run_id="${DISPATCH_SOURCE_RUN_ID:-}"
          v39_data_run_id="${DISPATCH_V39_DATA_RUN_ID:-}"
          if [[ -z "$source_run_id" ]]; then
            source_run_id="$(
              sed -n 's/^source_run_id=//p' \
                scripts/trigger_wp_v39_research.txt |
                tail -n 1
            )"
          fi
          if [[ -z "$v39_data_run_id" ]]; then
            v39_data_run_id="$(
              sed -n 's/^v39_data_run_id=//p' \
                scripts/trigger_wp_v39_research.txt |
                tail -n 1
            )"
          fi
          for value in "$source_run_id" "$v39_data_run_id"; do
            if [[ ! "$value" =~ ^[0-9]+$ ]]; then
              echo "Invalid immutable source run: $value" >&2
              exit 1
            fi
          done
          echo "run_id=$source_run_id" >> "$GITHUB_OUTPUT"
          echo "v39_data_run_id=$v39_data_run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Restore immutable V9 research contract
        uses: actions/cache/restore@v4
        with:
          path: artifacts/wp_v3_history
          key: wp-v19-panel-20210726-20260724-20230727-20260724-r15-${{ steps.source.outputs.run_id }}
          fail-on-cache-miss: true
      - name: Download immutable full-universe V9 OOS shards
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v19-v9-fold-*
          path: artifacts/wp_v39_source
          merge-multiple: false
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable V39 derivatives data
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v39-derivatives-data-*
          path: artifacts/wp_v39_data
          merge-multiple: false
          run-id: ${{ steps.source.outputs.v39_data_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify preregistered V39 contracts
        run: >-
          python -m pytest
          tests/test_v39_derivatives_daily.py
          tests/test_v39_derivatives_license.py
          tests/test_v22_market_license.py
          tests/test_v19_recall.py
          tests/test_v3_contracts.py
          -q
        env:
          PYTHONPATH: src:scripts
          LOKY_MAX_CPU_COUNT: "4"
      - name: Run nested V39 derivatives-license research
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/research_wp_v39_derivatives_license.py \
            --config artifacts/wp_v3_history/wp_v9_resolved_config.yml \
            --shard-dir artifacts/wp_v39_source \
            --v39-data-dir artifacts/wp_v39_data \
            --v39-data-run-id "${{ steps.source.outputs.v39_data_run_id }}" \
            --output-dir artifacts/wp_v39_research \
            --bootstrap-samples 1000 &
          research_pid=$!
          while kill -0 "$research_pid" 2>/dev/null; do
            echo "[wp-v39] research heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 120
          done
          wait "$research_pid"
        env:
          PYTHONPATH: src:scripts
          PYTHONUNBUFFERED: "1"
          LOKY_MAX_CPU_COUNT: "4"
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
      - name: Upload immutable V39 research evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v39-derivatives-license-research-${{ github.run_id }}
          path: artifacts/wp_v39_research
          retention-days: 90
          if-no-files-found: warn
