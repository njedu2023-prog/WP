name: Probe WP V33 Limit Industry Ecology

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v33_data_probe.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v33-limit-industry-ecology-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Download immutable V24 candidate source
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v24-point-in-time-data-30635569735
          path: artifacts/wp_v33_v24_source
          merge-multiple: false
          run-id: 30635569735
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable V28 membership source
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v28-fine-industry-peer-data-30656696310
          path: artifacts/wp_v33_v28_source
          merge-multiple: false
          run-id: 30656696310
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable V30 probe projection
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v30-limit-event-data-probe-30662958173
          path: artifacts/wp_v33_v30_source
          merge-multiple: false
          run-id: 30662958173
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify outcome-blind V33 probe contracts
        run: >-
          python -m pytest
          tests/test_v33_limit_ecology.py
          tests/test_v33_limit_ecology_probe.py
          tests/test_v30_limit_event_data_probe.py
          tests/test_v28_industry_peer_data.py
          tests/test_v24_data.py
          -q
        env:
          PYTHONPATH: src:scripts
      - name: Probe point-in-time limit-industry ecology
        run: >-
          python -u scripts/probe_wp_v33_limit_industry_ecology.py
          --v24-data-dir artifacts/wp_v33_v24_source
          --v28-data-dir artifacts/wp_v33_v28_source
          --v30-probe-dir artifacts/wp_v33_v30_source
          --output-dir artifacts/wp_v33_limit_industry_probe
        env:
          PYTHONPATH: src:scripts
          PYTHONUNBUFFERED: "1"
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - name: Upload immutable V33 probe evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v33-limit-industry-probe-${{ github.run_id }}
          path: artifacts/wp_v33_limit_industry_probe
          retention-days: 90
          if-no-files-found: warn
