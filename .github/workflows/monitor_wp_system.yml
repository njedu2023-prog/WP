name: Monitor WP System

on:
  workflow_dispatch:
  schedule:
    # Sparse checkpoints repair a missing tail session without recreating the
    # old all-day five-minute workflow churn.
    - cron: "3 6 * * 1-5"
    - cron: "23,38,53 6 * * 1-5"
    - cron: "3 7 * * 1-5"

permissions:
  actions: write
  contents: read

concurrency:
  group: wp-system-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check and repair WP system freshness
        run: python scripts/monitor_wp_system.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          WP_MONITOR_MAX_PAGE_LAG_MIN: "10"
