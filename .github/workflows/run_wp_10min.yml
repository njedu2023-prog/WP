name: Run WP V41 Fixed 14:00 Session

on:
  # Automatic schedule and trigger-file runs paused 2026-08-14 by user request.
  # Deliberate one-off runs remain available from the Actions UI.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wp-v3-output-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tail-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Resolve weekly runtime cache key
        id: runtime-week
        run: echo "week=$(TZ=Asia/Shanghai date +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore compact V41 runtime references
        uses: actions/cache@v4
        with:
          path: |
            data/v3/cache/trade_cal
            data/v3/cache/daily
            data/v3/cache/daily_basic
            data/v3/cache/adj_factor
            data/v3/cache/stk_limit
            data/v3/cache/stock_basic
            data/v3/cache/index_member_all
          key: wp-v41-runtime-ref-v2-${{ runner.os }}-${{ hashFiles('config/wp_v3.yml', 'src/wp/v3/history.py', 'src/wp/v3/live_data.py') }}-${{ steps.runtime-week.outputs.week }}
          restore-keys: |
            wp-v41-runtime-ref-v2-${{ runner.os }}-${{ hashFiles('config/wp_v3.yml', 'src/wp/v3/history.py', 'src/wp/v3/live_data.py') }}-
            wp-v41-runtime-ref-v2-${{ runner.os }}-
      - name: Verify exact V41 runtime package
        run: python scripts/check_wp_runtime_readiness.py
        env:
          PYTHONPATH: src
      - name: Run 13:55 cutoff and 14:00 publication session
        run: python scripts/run_wp_session.py
        env:
          PYTHONPATH: src
          WP_MODE: live
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # Auto keeps on-time runs exact and labels delayed executions as recovery.
          WP_RUN_MODE: auto
          WP_SCHEDULE_GRACE_SECONDS: "30"
          LOKY_MAX_CPU_COUNT: "2"
      - name: Prune and report compact runtime references
        run: |
          python scripts/prune_wp_runtime_cache.py
          du -ch \
            data/v3/cache/trade_cal \
            data/v3/cache/daily \
            data/v3/cache/daily_basic \
            data/v3/cache/adj_factor \
            data/v3/cache/stk_limit \
            data/v3/cache/stock_basic \
            data/v3/cache/index_member_all \
            2>/dev/null | tail -n 1 || true
