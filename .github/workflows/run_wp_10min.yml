name: Run WP V4 Tail Session

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_run.txt
  schedule:
    # 05:56 UTC = 13:56 Asia/Shanghai. Warm bars start at 14:00.
    - cron: "56 5 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wp-v3-output-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tail-session:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run causal V4 tail session
        run: python scripts/run_wp_session.py
        env:
          PYTHONPATH: src
          WP_MODE: live
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WP_RUN_MODE: ${{ github.event_name == 'schedule' && 'session' || 'once' }}
          WP_SESSION_INTERVAL_SECONDS: "300"
          WP_SCHEDULE_GRACE_SECONDS: "120"
          WP_MAX_SLOT_LATENESS_SECONDS: "420"
          LOKY_MAX_CPU_COUNT: "2"
