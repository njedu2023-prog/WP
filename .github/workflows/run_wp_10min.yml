name: Run WP V41 Fixed 14:00 Session

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_run.txt

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wp-v3-output-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tail-session:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Restore causal reference cache
        uses: actions/cache@v4
        with:
          path: data/v3/cache
          key: wp-v41-live-${{ runner.os }}-${{ hashFiles('config/wp_v3.yml', 'src/wp/v3/**/*.py') }}-${{ github.run_id }}
          restore-keys: |
            wp-v41-live-${{ runner.os }}-${{ hashFiles('config/wp_v3.yml', 'src/wp/v3/**/*.py') }}-
      - name: Verify exact V41 runtime package
        run: python scripts/check_wp_runtime_readiness.py
        env:
          PYTHONPATH: src
      - name: Run exact 14:00 signal and 14:05 settlement
        run: python scripts/run_wp_session.py
        env:
          PYTHONPATH: src
          WP_MODE: live
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WP_RUN_MODE: exact
          WP_SCHEDULE_GRACE_SECONDS: "120"
          WP_MAX_CAPTURE_LATENESS_SECONDS: "45"
          LOKY_MAX_CPU_COUNT: "2"
