name: Probe WP V32 A-Share Event Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v32_data_probe.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v32-a-share-event-data-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Download immutable V24 outcome-blind source
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v24-point-in-time-data-30635569735
          path: artifacts/wp_v32_v24_source
          merge-multiple: false
          run-id: 30635569735
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable failed V31 probe evidence
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v31-public-event-data-probe-30663984930
          path: artifacts/wp_v32_v31_probe
          merge-multiple: false
          run-id: 30663984930
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify outcome-blind V32 normalization contracts
        run: >-
          python -m pytest
          tests/test_v32_a_share_event_data_probe.py
          tests/test_v31_public_event_data_probe.py
          tests/test_v24_data.py
          -q
        env:
          PYTHONPATH: src:scripts
      - name: Re-audit immutable event data in A-share universe
        run: >-
          python -u scripts/probe_wp_v32_a_share_event_data.py
          --v24-data-dir artifacts/wp_v32_v24_source
          --v31-probe-dir artifacts/wp_v32_v31_probe
          --output-dir artifacts/wp_v32_a_share_event_probe
        env:
          PYTHONPATH: src:scripts
          PYTHONUNBUFFERED: "1"
      - name: Upload immutable V32 probe evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v32-a-share-event-data-probe-${{ github.run_id }}
          path: artifacts/wp_v32_a_share_event_probe
          retention-days: 90
          if-no-files-found: warn
