name: Probe WP V26 Crowd Confirmation Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v26_data_probe.txt

permissions:
  contents: read

concurrency:
  group: wp-v26-crowd-confirmation-data-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Verify outcome-blind V26 probe contracts
        run: >-
          python -m pytest
          tests/test_v26_crowd_confirmation_data_probe.py
          -q
        env:
          PYTHONPATH: src:scripts
      - name: Probe point-in-time crowd confirmation data
        run: python -u scripts/probe_wp_v26_crowd_confirmation_data.py
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          WP_V26_PROBE_OUTPUT: artifacts/wp_v26_data_probe
      - name: Upload immutable V26 probe evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v26-crowd-confirmation-data-probe-${{ github.run_id }}
          path: artifacts/wp_v26_data_probe
          retention-days: 90
          if-no-files-found: warn
