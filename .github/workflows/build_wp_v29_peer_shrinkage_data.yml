name: Build WP V29 Hierarchical Peer Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v29_data_build.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v29-hierarchical-peer-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Download immutable V24 identity contract
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v24-point-in-time-data-30635569735
          path: artifacts/wp_v29_v24_source
          merge-multiple: false
          run-id: 30635569735
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable failed-gate V28 peer data
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v28-fine-industry-peer-data-30656696310
          path: artifacts/wp_v29_v28_source
          merge-multiple: false
          run-id: 30656696310
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable V28 coverage diagnosis
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v28-feature-coverage-diagnosis-30659154353
          path: artifacts/wp_v29_v28_diagnosis
          merge-multiple: false
          run-id: 30659154353
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify outcome-blind V29 data contracts
        run: >-
          python -m pytest
          tests/test_v29_peer_shrinkage_data.py
          tests/test_v28_coverage_diagnosis.py
          tests/test_v28_industry_peer_data.py
          tests/test_v24_data.py
          -q
        env:
          PYTHONPATH: src:scripts
      - name: Build finite hierarchical peer representation
        run: >-
          python -u scripts/build_wp_v29_peer_shrinkage_data.py
          --v24-data-dir artifacts/wp_v29_v24_source
          --v28-data-dir artifacts/wp_v29_v28_source
          --v28-diagnosis-dir artifacts/wp_v29_v28_diagnosis
          --output-dir artifacts/wp_v29_peer_shrinkage_data
        env:
          PYTHONPATH: src:scripts
          PYTHONUNBUFFERED: "1"
      - name: Upload immutable V29 outcome-blind data
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v29-peer-shrinkage-data-${{ github.run_id }}
          path: artifacts/wp_v29_peer_shrinkage_data
          retention-days: 90
          if-no-files-found: warn
