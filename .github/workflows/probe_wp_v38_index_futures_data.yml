name: Probe WP V38 Index Futures Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v38_data_probe.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v38-index-futures-data-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Verify frozen V38 outcome-blind contracts
        run: >-
          python -m pytest
          tests/test_v38_index_futures.py
          -q
        env:
          PYTHONPATH: src:scripts
      - name: Probe index-futures and ETF minute data
        run: >-
          python -u scripts/probe_wp_v38_index_futures_data.py
          --output-dir artifacts/wp_v38_index_futures_probe
          --workers 4
        env:
          PYTHONPATH: src:scripts
          PYTHONUNBUFFERED: "1"
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - name: Upload immutable V38 probe evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v38-index-futures-probe-${{ github.run_id }}
          path: artifacts/wp_v38_index_futures_probe
          retention-days: 90
          if-no-files-found: warn
