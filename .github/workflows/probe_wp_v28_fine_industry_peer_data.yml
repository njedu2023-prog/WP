name: Probe WP V28 Fine Industry Peer Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v28_data_probe.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v28-fine-industry-peer-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Restore immutable full-market minute substrate
        uses: actions/cache/restore@v4
        with:
          path: artifacts/wp_v3_history
          key: wp-v19-panel-20210726-20260724-20230727-20260724-r15-30600193544
          fail-on-cache-miss: true
      - name: Verify outcome-blind V28 data contracts
        run: >-
          python -m pytest
          tests/test_v28_industry_peer_data.py
          tests/test_v26_crowd_confirmation_data_probe.py
          -q
        env:
          PYTHONPATH: src:scripts
      - name: Probe fine-industry peer coverage
        run: python -u scripts/probe_wp_v28_fine_industry_peer_data.py
        env:
          PYTHONPATH: src:scripts
          PYTHONUNBUFFERED: "1"
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - name: Upload immutable V28 data evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v28-fine-industry-peer-probe-${{ github.run_id }}
          path: artifacts/wp_v28_data_probe
          retention-days: 90
          if-no-files-found: warn
