name: Build WP V25 Positioning Data

on:
  workflow_dispatch:
    inputs:
      source_v24_data_run_id:
        description: Completed immutable V24 point-in-time data run
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v25_data_build.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v25-positioning-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Resolve immutable V24 data run
        id: source
        shell: bash
        env:
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source_v24_data_run_id }}
        run: |
          set -euo pipefail
          source_run_id="${DISPATCH_SOURCE_RUN_ID:-}"
          if [[ -z "$source_run_id" ]]; then
            source_run_id="$(
              sed -n 's/^source_v24_data_run_id=//p' \
                scripts/trigger_wp_v25_data_build.txt |
                tail -n 1
            )"
          fi
          if [[ ! "$source_run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid source_v24_data_run_id: $source_run_id" >&2
            exit 1
          fi
          echo "run_id=$source_run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Restore immutable V9 research contract
        uses: actions/cache/restore@v4
        with:
          path: artifacts/wp_v3_history
          key: wp-v19-panel-20210726-20260724-20230727-20260724-r15-30600193544
          fail-on-cache-miss: true
      - name: Download immutable V24 point-in-time source
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v24-point-in-time-data-*
          path: artifacts/wp_v25_source
          merge-multiple: false
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore resumable V25 query cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/wp_v25_query_cache
          key: wp-v25-positioning-cache-1-${{ github.run_id }}
          restore-keys: |
            wp-v25-positioning-cache-1-
      - name: Verify outcome-blind V25 data contracts
        run: >-
          python -m pytest
          tests/test_v25_positioning.py
          tests/test_v25_positioning_data_probe.py
          tests/test_v24_data.py
          tests/test_v3_contracts.py
          -q
        env:
          PYTHONPATH: src:scripts
      - name: Build causal V25 positioning dataset
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/build_wp_v25_positioning_data.py \
            --config artifacts/wp_v3_history/wp_v9_resolved_config.yml \
            --source-dir artifacts/wp_v25_source \
            --output-dir artifacts/wp_v25_positioning_data \
            --cache-dir artifacts/wp_v25_query_cache \
            --workers 4 &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            echo "[wp-v25-data] heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 120
          done
          wait "$build_pid"
        env:
          PYTHONPATH: src:scripts
          PYTHONUNBUFFERED: "1"
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
      - name: Save resumable V25 query cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/wp_v25_query_cache
          key: wp-v25-positioning-cache-1-${{ github.run_id }}
      - name: Upload immutable V25 positioning dataset
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v25-positioning-data-${{ github.run_id }}
          path: artifacts/wp_v25_positioning_data
          retention-days: 90
          if-no-files-found: warn

