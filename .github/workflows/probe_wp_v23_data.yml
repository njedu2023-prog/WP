name: Probe WP V23 Point-in-Time Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v23_data_probe.txt

permissions:
  contents: read

concurrency:
  group: wp-v23-data-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Probe reproducible causal data families
        run: python -u scripts/probe_wp_v23_point_in_time_data.py
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          WP_V23_PROBE_OUTPUT: artifacts/wp_v23_data_probe
      - name: Upload immutable probe evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v23-data-probe-${{ github.run_id }}
          path: artifacts/wp_v23_data_probe
          retention-days: 90
          if-no-files-found: warn
