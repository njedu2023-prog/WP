name: Clear stale GitHub Pages deployment lock

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clear_stale_pages.yml

permissions:
  contents: read
  pages: write

jobs:
  cancel-stale-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_DEPLOYMENT_ID: fd859680e0020b41706afe3498a799e4d2e58425
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/deployments/${PAGES_DEPLOYMENT_ID}/cancel"
