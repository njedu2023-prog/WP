name: Verify WP V15 Frozen Candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v15_freeze_verification.txt

permissions:
  contents: read

concurrency:
  group: wp-v15-freeze-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Run frozen-candidate tests
        run: >-
          python -m pytest
          tests/test_v15_forward_risk_validation.py
          tests/test_v15_frozen_candidate.py
          -q
        env:
          PYTHONPATH: src
      - name: Verify immutable manifest and runtime contract
        run: >-
          python scripts/verify_wp_v15_frozen_candidate.py
          --manifest config/wp_v15_frozen_shadow_candidate.json
          --config config/wp_v3.yml
          --output artifacts/wp_v15_freeze/verification.json
        env:
          PYTHONPATH: src
      - name: Upload freeze verification
        uses: actions/upload-artifact@v5
        with:
          name: wp-v15-freeze-verification-${{ github.run_id }}
          path: artifacts/wp_v15_freeze
          retention-days: 90
          if-no-files-found: error
