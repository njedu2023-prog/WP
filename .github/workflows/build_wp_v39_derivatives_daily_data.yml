name: Build WP V39 T-1 Derivatives Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v39_data_build.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v39-tminus1-derivatives-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Restore resumable V39 query cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/wp_v39_query_cache
          key: wp-v39-derivatives-cache-1-${{ github.run_id }}
          restore-keys: |
            wp-v39-derivatives-cache-1-
      - name: Verify frozen V39 contracts
        run: >-
          python -m pytest
          tests/test_v39_derivatives_daily.py
          -q
        env:
          PYTHONPATH: src:scripts
      - name: Build three-year outcome-blind V39 data
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/build_wp_v39_derivatives_daily_data.py \
            --output-dir artifacts/wp_v39_derivatives_data \
            --cache-dir artifacts/wp_v39_query_cache \
            --start-date 20230727 \
            --end-date 20260724 &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            echo "[wp-v39-data] heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 120
          done
          wait "$build_pid"
        env:
          PYTHONPATH: src:scripts
          PYTHONUNBUFFERED: "1"
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
      - name: Save resumable V39 query cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/wp_v39_query_cache
          key: wp-v39-derivatives-cache-1-${{ github.run_id }}
      - name: Upload immutable V39 three-year data
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v39-derivatives-data-${{ github.run_id }}
          path: artifacts/wp_v39_derivatives_data
          retention-days: 90
          if-no-files-found: warn
