name: Research WP V11 Executable Exit Contracts

on:
  workflow_dispatch:
    inputs:
      source_v9_run_id:
        description: "Immutable WP V9 research run ID"
        required: true
        default: "30466227350"
        type: string
      source_v10_run_id:
        description: "Immutable WP V10 research run ID"
        required: true
        default: "30516136872"
        type: string
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v11_exit.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v11-exit-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Resolve immutable source runs
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_V9_RUN_ID: ${{ inputs.source_v9_run_id }}
          REQUESTED_V10_RUN_ID: ${{ inputs.source_v10_run_id }}
        run: |
          set -euo pipefail
          v9_run_id="$REQUESTED_V9_RUN_ID"
          v10_run_id="$REQUESTED_V10_RUN_ID"
          if [[ "$EVENT_NAME" == "push" ]]; then
            v9_run_id="$(
              sed -n 's/^source_v9_run_id=//p' \
                scripts/trigger_wp_v11_exit.txt \
                | tail -n 1 \
                | tr -cd '0-9'
            )"
            v10_run_id="$(
              sed -n 's/^source_v10_run_id=//p' \
                scripts/trigger_wp_v11_exit.txt \
                | tail -n 1 \
                | tr -cd '0-9'
            )"
          fi
          test -n "$v9_run_id"
          test -n "$v10_run_id"
          echo "v9_run_id=$v9_run_id" >> "$GITHUB_OUTPUT"
          echo "v10_run_id=$v10_run_id" >> "$GITHUB_OUTPUT"
      - name: Restore exact V9 causal panel
        uses: actions/cache/restore@v4
        with:
          path: artifacts/wp_v3_history
          key: wp-v9-panel-auto-auto-auto-auto-r15-${{ steps.route.outputs.v9_run_id }}
          fail-on-cache-miss: true
      - name: Download immutable V9 OOS prediction shards
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.route.outputs.v9_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: wp-v9-fold-*
          path: artifacts/wp_v3_shards
          merge-multiple: false
      - name: Download immutable V10 selected candidates
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ steps.route.outputs.v10_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: wp-v10-meta-*
          path: artifacts/wp_v10_source
          merge-multiple: true
      - name: Verify V11 exit research contracts
        run: python -m pytest tests/test_v11_exit_research.py -q
        env:
          PYTHONPATH: src
      - name: Run nested executable exit research
        run: >-
          python -u scripts/research_wp_v11_exit.py
          --config artifacts/wp_v3_history/wp_v9_resolved_config.yml
          --panel-dir artifacts/wp_v3_history/panel
          --shard-dir artifacts/wp_v3_shards
          --v10-source-dir artifacts/wp_v10_source
          --output-dir artifacts/wp_v11_exit
          --top-per-score 12
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
      - name: Upload immutable V11 exit evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v11-exit-${{ github.run_id }}
          path: artifacts/wp_v11_exit
          retention-days: 90
          if-no-files-found: warn
