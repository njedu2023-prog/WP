name: Build WP V33 Limit Industry Ecology Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v33_data_build.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v33-limit-industry-ecology-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Download immutable V24 candidate source
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v24-point-in-time-data-30635569735
          path: artifacts/wp_v33_v24_source
          merge-multiple: false
          run-id: 30635569735
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable V28 membership source
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v28-fine-industry-peer-data-30656696310
          path: artifacts/wp_v33_v28_source
          merge-multiple: false
          run-id: 30656696310
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable V33 probe source
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v33-limit-industry-probe-30671024383
          path: artifacts/wp_v33_probe_source
          merge-multiple: false
          run-id: 30671024383
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore resumable V33 query cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/wp_v33_query_cache
          key: wp-v33-ecology-cache-1-30635569735-${{ github.run_id }}
          restore-keys: |
            wp-v33-ecology-cache-1-30635569735-
      - name: Verify outcome-blind V33 full-data contracts
        run: >-
          python -m pytest
          tests/test_v33_limit_ecology.py
          tests/test_v33_limit_ecology_probe.py
          tests/test_v33_limit_ecology_data.py
          tests/test_v30_limit_event_data_probe.py
          tests/test_v28_industry_peer_data.py
          tests/test_v24_data.py
          -q
        env:
          PYTHONPATH: src:scripts
      - name: Build three-year causal limit-industry ecology
        shell: bash
        run: |
          set -euo pipefail
          python -u scripts/build_wp_v33_limit_industry_ecology.py \
            --v24-data-dir artifacts/wp_v33_v24_source \
            --v28-data-dir artifacts/wp_v33_v28_source \
            --v33-probe-dir artifacts/wp_v33_probe_source \
            --output-dir artifacts/wp_v33_limit_industry_data \
            --cache-dir artifacts/wp_v33_query_cache &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            echo "[wp-v33-data] heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 120
          done
          wait "$build_pid"
        env:
          PYTHONPATH: src:scripts
          PYTHONUNBUFFERED: "1"
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          OMP_NUM_THREADS: "2"
          OPENBLAS_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
      - name: Save resumable V33 query cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/wp_v33_query_cache
          key: wp-v33-ecology-cache-1-30635569735-${{ github.run_id }}
      - name: Upload immutable V33 full-data evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v33-limit-industry-data-${{ github.run_id }}
          path: artifacts/wp_v33_limit_industry_data
          retention-days: 90
          if-no-files-found: warn
