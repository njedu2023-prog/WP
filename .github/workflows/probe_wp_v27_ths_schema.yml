name: Probe WP V27 THS Historical Schema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v27_schema_probe.txt

permissions:
  contents: read

concurrency:
  group: wp-v27-ths-schema-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Verify outcome-blind V27 schema contracts
        run: >-
          python -m pytest
          tests/test_v26_crowd_confirmation_data_probe.py
          tests/test_v27_ths_schema_probe.py
          -q
        env:
          PYTHONPATH: src:scripts
      - name: Probe THS historical schema normalization
        run: python -u scripts/probe_wp_v27_ths_schema.py
        env:
          PYTHONPATH: src:scripts
          PYTHONUNBUFFERED: "1"
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          WP_V27_PROBE_OUTPUT: artifacts/wp_v27_schema_probe
      - name: Upload immutable V27 schema evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v27-ths-schema-probe-${{ github.run_id }}
          path: artifacts/wp_v27_schema_probe
          retention-days: 90
          if-no-files-found: warn
