name: Probe WP V34 Full Session Path

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v34_data_probe.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v34-full-session-path-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Download immutable V24 candidate source
        uses: actions/download-artifact@v5
        with:
          pattern: wp-v24-point-in-time-data-30635569735
          path: artifacts/wp_v34_v24_source
          merge-multiple: false
          run-id: 30635569735
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify V34 outcome-blind contracts
        run: >-
          python -m pytest
          tests/test_v34_intraday_path.py
          tests/test_v24_data.py
          -q
        env:
          PYTHONPATH: src:scripts
      - name: Probe full-session intraday paths
        run: >-
          python -u scripts/probe_wp_v34_intraday_path.py
          --v24-data-dir artifacts/wp_v34_v24_source
          --output-dir artifacts/wp_v34_intraday_path_probe
          --workers 4
        env:
          PYTHONPATH: src:scripts
          PYTHONUNBUFFERED: "1"
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - name: Upload immutable V34 probe evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v34-intraday-path-probe-${{ github.run_id }}
          path: artifacts/wp_v34_intraday_path_probe
          retention-days: 90
          if-no-files-found: warn
