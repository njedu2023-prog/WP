name: Probe WP V39 T-1 Derivatives Daily

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/trigger_wp_v39_data_probe.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: wp-v39-tminus1-derivatives-data-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: pip install -r requirements.lock
      - name: Verify frozen V39 outcome-blind contracts
        run: >-
          python -m pytest
          tests/test_v39_derivatives_daily.py
          -q
        env:
          PYTHONPATH: src:scripts
      - name: Probe T-1 derivatives daily data
        run: >-
          python -u scripts/probe_wp_v39_derivatives_daily.py
          --output-dir artifacts/wp_v39_derivatives_daily_probe
        env:
          PYTHONPATH: src:scripts
          PYTHONUNBUFFERED: "1"
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      - name: Upload immutable V39 probe evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wp-v39-derivatives-daily-probe-${{ github.run_id }}
          path: artifacts/wp_v39_derivatives_daily_probe
          retention-days: 90
          if-no-files-found: warn
