name: Validate WP Close

on:
  # Automatic schedule and trigger-file runs paused 2026-08-14 by user request.
  # Deliberate one-off runs remain available from the Actions UI.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wp-v3-output-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-close:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Validate pending plans with next-day close
        run: python scripts/run_wp_close_validation.py
        env:
          PYTHONPATH: src
          WP_MODE: live
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WP_CLOSE_RUN_MODE: session
          WP_CLOSE_INTERVAL_SECONDS: "120"
          WP_CLOSE_END_TIME: "19:00"
          LOKY_MAX_CPU_COUNT: "2"
