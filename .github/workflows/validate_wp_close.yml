name: Validate WP Close

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/trigger_wp_close_validation.txt
      - .github/workflows/validate_wp_close.yml
  schedule:
    # 08:07 UTC = 16:07 Asia/Shanghai. Retry until all due T+1 truth is written.
    - cron: "7 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: wp-v3-output-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-close:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Validate pending plans with next-day close
        run: python scripts/run_wp_close_validation.py
        env:
          PYTHONPATH: src
          WP_MODE: live
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WP_CLOSE_RUN_MODE: session
          WP_CLOSE_INTERVAL_SECONDS: "120"
          WP_CLOSE_END_TIME: "19:00"
          LOKY_MAX_CPU_COUNT: "2"
